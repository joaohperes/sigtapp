<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background: dark rounded square matching app dark theme (#18181b) -->
  <rect width="32" height="32" rx="6" fill="#18181b"/>

  <!--
    Letter S, drawn as a stroke path.
    Width: x 10–22 (12px), Height: y 7–25 (18px), centered at x=16.
    Top arc goes right→left; bottom arc goes left→right, forming the S.
  -->
  <path
    d="M21 10.5
       C 21 8,   18.5 7, 16 7
       C 13.5 7, 11 8.5, 11 11
       C 11 13.5, 13.5 14.5, 16 15.5
       C 18.5 16.5, 21 17.5, 21 20.5
       C 21 23.5, 18.5 25, 16 25
       C 13.5 25, 11 23.5, 11 21.5"
    stroke="#10b981"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>
